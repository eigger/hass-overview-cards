# Shared standards; use the reviewed immutable release's exact version tag (CARD-04).
name: Check
'on':
  push: null
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    uses: eigger/hass-repo-standards/.github/workflows/card-check.yml@v1.2.0
    with:
      node-version: '22'
      check-script: check
      test-script: test
      build-script: ''
      bundle-path: compact-overview-card.js
