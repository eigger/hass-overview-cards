name: Dependabot auto-merge
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, closed]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auto-merge:
    permissions:
      contents: write
      pull-requests: write
    # Reviewed workflow from standards v1.1.5; this does not enroll the repository
    # in the integration standards profile or its automatic standards updates.
    uses: eigger/hass-repo-standards/.github/workflows/dependabot-auto-merge.yml@f56987f7f765a774c926fb8005fe5df68bb32451 # v1.1.5
