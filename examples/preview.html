<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Overview Cards · Preview</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:light;--primary-color:#008bba;--primary-text-color:#263238;--secondary-text-color:#66747c;--divider-color:#e3e7e9;--disabled-color:#a5afb5;--card-background-color:#fff;--warning-color:#ffa600;--error-color:#db4437}
body{background:#f2f5f6;margin:24px}body.dark{color-scheme:dark;--primary-text-color:#e6edef;--secondary-text-color:#9caeb6;--divider-color:#35434a;--disabled-color:#66767e;--card-background-color:#202b30;background:#12181b}
h1{font-size:20px;margin:0 0 8px}p{font-size:13px;color:var(--secondary-text-color)}nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}nav select,nav button{font:inherit;padding:8px;border:1px solid var(--divider-color);border-radius:8px;background:var(--card-background-color);color:var(--primary-text-color)}
main{width:390px;max-width:100%}body.capture{margin:8px}body.capture>h1,body.capture>p,body.capture>nav{display:none}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#263238;color:#fff;border-radius:8px;padding:8px 12px;font-size:13px;opacity:0;pointer-events:none}.toast.show{opacity:1}
</style>
<h1>Overview Cards</h1><p>모의 상태를 사용한 브라우저 미리보기 · 실제 기기에 명령을 보내지 않습니다.</p>
<nav><select aria-label="미리보기 너비"><option value="320">320px</option><option value="390" selected>390px</option><option value="760">760px</option></select><button id="theme">테마 변경</button></nav>
<main></main><div class="toast" role="status" aria-live="polite"></div>
<script src="preview-icons.js"></script><script src="preview-locale.js"></script><script>
customElements.define('ha-card',class extends HTMLElement{constructor(){super();this.attachShadow({mode:'open'}).innerHTML='<style>:host{display:block;background:var(--card-background-color);border:1px solid var(--divider-color);border-radius:var(--ha-card-border-radius,14px);color:var(--primary-text-color)}</style><slot></slot>';}});
customElements.define('ha-icon',class extends HTMLElement{
 constructor(){super();this.attachShadow({mode:'open'});this._observer=new MutationObserver(()=>this.update());}
 connectedCallback(){this.update();this._observer.observe(this,{attributes:true,attributeFilter:['icon']});}
 disconnectedCallback(){this._observer.disconnect();}
 get icon(){return this.getAttribute('icon');}set icon(value){this.setAttribute('icon',value);}
 update(){const key=(this.getAttribute('icon')||'').replace('mdi:',''),path=window.compactPreviewIcons?.[key];this.shadowRoot.innerHTML='<style>:host{display:inline-flex;align-items:center;justify-content:center}</style>';if(!path)return;const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'),glyph=document.createElementNS('http://www.w3.org/2000/svg','path');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('width','100%');svg.setAttribute('height','100%');svg.setAttribute('fill','currentColor');glyph.setAttribute('d',path);svg.append(glyph);this.shadowRoot.append(svg);}
});
</script><script src="../compact-overview-card.js"></script><script src="states.js"></script><script>
const params=new URLSearchParams(location.search),{translate}=compactPreviewLocale,{states,config,scenarios,format}=overviewPreview;
const toast=document.querySelector('.toast'),main=document.querySelector('main');
if(['320','390','760'].includes(params.get('width'))){main.style.width=params.get('width')+'px';document.querySelector('select').value=params.get('width');}
if(params.get('theme')==='dark')document.body.classList.add('dark');
if(params.get('capture')==='true')document.body.classList.add('capture');
const scenario=params.get('scenario')||'normal',initial=states();(scenarios[scenario]||scenarios.normal)(initial);
const hass={states:translate(initial),formatEntityState:s=>translate(format(s)),callService(){throw new Error('read-only')}};
compactPreviewLocale.start();
const card=document.createElement('compact-overview-card');card.setConfig(translate(config()));card.hass=hass;main.append(card);
card.addEventListener('hass-more-info',e=>{toast.textContent=translate('모의 정보')+' · '+e.detail.entityId;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1400);});
window.addEventListener('location-changed',()=>{toast.textContent='navigate → '+location.pathname;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1400);});
document.querySelector('select').onchange=e=>main.style.width=e.target.value+'px';
document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');
</script></html>
