# 오버뷰 뷰 한 장과 하위 뷰로 이동하는 최소 대시보드 예제입니다. 엔티티 ID와 경로를 환경에 맞게 변경하세요.
title: "집"
views:
  - title: "홈"
    path: "overview"
    type: "sections"
    max_columns: 3
    sections:
      - type: "grid"
        column_span: 3          # PC에서 전체 폭 사용
        cards:
          - type: "custom:compact-overview-card"
            grid_options:
              columns: "full"
            alerts:
              - entity: "binary_sensor.kitchen_leak"
                name: "누수 · 주방"
                when: { state: "on" }
                level: "critical"
            sections:
              - name: "조명"
                icon: "mdi:lightbulb-group"
                navigation_path: "/lovelace/rooms"
                summary:
                  type: "count"
                  entities: ["light.living_room", "light.bedroom"]
                controls:
                  - { entity: "light.living_room", name: "거실" }
                  - { entity: "light.bedroom", name: "침실" }
              - name: "냉난방"
                icon: "mdi:thermostat"
                navigation_path: "/lovelace/rooms"
                summary: { type: "climate", entities: ["climate.living_room"] }
                controls:
                  - { entity: "climate.living_room", name: "거실 냉난방" }
  - title: "공간"
    path: "rooms"
    icon: "mdi:floor-plan"
    type: "sections"
    sections: []
