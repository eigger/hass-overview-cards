# 오버뷰 뷰 한 장과 하위 뷰로 이동하는 최소 대시보드 예제입니다. 엔티티 ID와 경로를 환경에 맞게 변경하세요.
title: "집"
views:
  - title: "홈"
    path: "overview"
    type: "sections"
    max_columns: 3
    sections:
      - type: "grid"
        cards:
          - type: "custom:compact-overview-card"
            name: "우리집 요약"
            alerts:
              - entity: "binary_sensor.kitchen_leak"
                name: "누수 · 주방"
                when: { state: "on" }
                level: "critical"
            tiles:
              - type: "count"
                name: "조명"
                icon: "mdi:lightbulb-group"
                entities: ["light.living_room", "light.bedroom"]
                navigation_path: "/lovelace/rooms"
              - type: "value"
                name: "에너지"
                icon: "mdi:flash"
                entity: "sensor.power"
                navigation_path: "/lovelace/manage"
  - title: "공간"
    path: "rooms"
    icon: "mdi:floor-plan"
    type: "sections"
    sections: []
